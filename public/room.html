<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Giftcard · ห้องจับฉลาก</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bgwrap" id="bg" aria-hidden="true"></div>
<div class="app roommain">
  <header class="top roomhead">
    <div class="brand">
      <span class="brand-mark pattern" aria-hidden="true"></span>
      <div>
        <div class="brand-name" id="evTitle">Giftcard</div>
        <div class="brand-sub" id="evPhase"></div>
      </div>
    </div>
  </header>
  <p class="net" id="net" hidden>เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ในตอนนี้ ข้อมูลที่เห็นอาจไม่ล่าสุด</p>

  <main>
    <section id="v-boot"><p class="muted">กำลังเชื่อมต่อห้องจับฉลาก</p></section>

    <section id="v-blocked" class="narrow" hidden>
      <h1 class="h" id="bTitle"></h1>
      <p class="lead" id="bBody"></p>
    </section>

    <section id="v-main" class="narrow" hidden>
      <div class="bigcount"><b id="mCount">0</b><span id="mCountLab"></span></div>
      <p class="muted" id="mSub"></p>
      <div id="mMine"></div>
      <div id="mFree"></div>
      <div class="srchbox"><label class="sr" for="mQ">ค้นหาชื่อ</label><input type="text" id="mQ" placeholder="ค้นหาชื่อ" autocomplete="off"></div>
      <div id="mRes"></div>
      <div id="mList"></div>
      <div class="btnrow" id="mDraw" style="margin-top:22px" hidden></div>
    </section>

    <section id="v-form" class="narrow" hidden>
      <h1 class="h" id="formTitle">ลงทะเบียนของขวัญ</h1>
      <p class="lead">บอกชื่อของคุณกับของขวัญที่เตรียมมา หลังจับฉลากจะมีคนได้รับของขวัญนี้ และคุณจะได้ของขวัญของคนอื่น</p>
      <form id="f" class="panel" autocomplete="off" novalidate>
        <div class="field">
          <label class="lbl" for="fNick">ชื่อ</label>
          <input type="text" id="fNick" maxlength="24">
          <span class="hintx">ชื่อเล่นหรืออะไรก็ได้ที่เพื่อนๆ จำได้</span>
          <span class="ferr" id="eNick" role="alert"></span>
        </div>
        <div class="field">
          <label class="lbl" for="fGift">ของขวัญคืออะไร</label>
          <textarea id="fGift" maxlength="200" rows="3" placeholder="เช่น แก้วเซรามิกสีครีม"></textarea>
          <label class="switch"><input type="checkbox" id="fUn"> <span>ไม่ระบุ (ให้เป็นกล่องปริศนา ?)</span></label>
          <span class="ferr" id="eGift" role="alert"></span>
        </div>
        <div class="field">
          <span class="lbl">ภาพตัวอย่างของขวัญ</span>
          <div class="prevbox"><div class="pv" id="fPrev"></div><div class="hintx" id="fPrevTxt"></div></div>
        </div>
        <p class="ferr" id="eForm" role="alert"></p>
        <div class="btnrow">
          <button class="btn" type="submit" id="fSubmit">ลงทะเบียน</button>
          <button class="btn ghost" type="button" id="fCancel">ยกเลิก</button>
        </div>
      </form>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/common.js"></script>
<script src="/scene.js"></script>
<script>
(async function () {
'use strict';
var G = window.GD, el = G.el, toast = G.toast;
var $ = function (s) { return document.querySelector(s); };
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var CODE = ((location.pathname.match(/\/r\/([A-Za-z0-9]+)/) || [])[1] || '').toUpperCase();
var COLORS = ['#c8334b', '#2f9e7a', '#7a5cd6', '#3d8fd0', '#d9703a'];

var S = { room: null, me: null, myRes: null, loaded: false, sig: '', q: '', editing: false, pin: '' };
var sb = null;
var VIEWS = ['boot', 'blocked', 'main', 'form'];
function show(name) { VIEWS.forEach(function (v) { $('#v-' + v).hidden = v !== name; }); }
function block(title, body) { show('blocked'); $('#bTitle').textContent = title; $('#bBody').textContent = body; }
function netNote(on) { $('#net').hidden = !on; }
var playerOf = function (id) { return S.room.players.find(function (p) { return p.id === id; }); };

/* ---------- เริ่มระบบ ---------- */
async function boot() {
  if (!CODE) { block('ไม่พบห้อง', 'ลิงก์ไม่ถูกต้อง ขอลิงก์ห้องจากผู้จัด'); return; }
  var cfg = null;
  try { cfg = await (await fetch('/api/config')).json(); } catch (e) {}
  if (!cfg || !cfg.url || !cfg.anonKey) { block('ยังตั้งค่าระบบไม่ครบ', 'แจ้งผู้จัดงานให้ตรวจค่า SUPABASE_URL และ SUPABASE_ANON_KEY ใน Vercel'); return; }
  sb = window.supabase.createClient(cfg.url, cfg.anonKey);
  var sess = (await sb.auth.getSession()).data.session;
  if (!sess) {
    var r = await sb.auth.signInAnonymously();
    if (r.error || !r.data.session) { block('เข้าระบบไม่ได้', 'แจ้งผู้จัดงานให้เปิด Anonymous sign-ins ใน Supabase (Authentication > Providers)'); return; }
  }
  document.title = 'Giftcard · ห้อง ' + CODE;
  await refresh();
  setInterval(function () { if (!document.hidden) refresh(); }, 10000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
}
async function api(path, body) {
  var s = (await sb.auth.getSession()).data.session;
  var out = {};
  try {
    var r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + (s ? s.access_token : '') }, body: JSON.stringify(Object.assign({ room: CODE }, body)) });
    try { out = await r.json(); } catch (e) {}
    out.status = r.status;
  } catch (e) { out = { status: 0, error: 'network' }; }
  return out;
}
async function refresh(force) {
  if (!sb) return;
  var q;
  try {
    q = await Promise.all([
      fetch('/api/room?code=' + encodeURIComponent(CODE)).then(function (r) { return r.status === 404 ? { notFound: true } : r.json().then(function (d) { return { data: d, error: r.ok ? null : d }; }); }),
      sb.from('players').select('*').eq('room_id', CODE).maybeSingle(),
      sb.from('results').select('*').eq('room_id', CODE).maybeSingle()
    ]);
    if (q[0].notFound) { block('ไม่พบห้องนี้', 'รหัสห้องไม่ถูกต้อง หรือห้องหมดอายุและถูกลบแล้ว ขอลิงก์ใหม่จากผู้จัด'); return; }
  } catch (e) { netNote(true); return; }
  if (q.some(function (x) { return x.error; })) { netNote(true); if (!S.loaded) block('เชื่อมต่อฐานข้อมูลไม่ได้', 'ลองรีเฟรชหน้านี้ ถ้ายังไม่ได้ให้แจ้งผู้จัดงานตรวจว่ารัน schema.sql แล้ว'); return; }
  netNote(false);
  var sig = JSON.stringify([q[0].data, q[1].data, q[2].data]);
  var first = !S.loaded;
  S.room = q[0].data; S.me = q[1].data; S.myRes = q[2].data; S.loaded = true;
  if (first || force || sig !== S.sig) { S.sig = sig; route(); }
}

/* ---------- เลือกหน้า ---------- */
function route() {
  $('#evTitle').textContent = S.room.title;
  $('#evPhase').textContent = S.room.phase === 'drawn' ? 'จับฉลากแล้ว' : 'เปิดลงทะเบียน';
  if (window.GCScene) GCScene.bgBoxes($('#bg'), S.room.players.length);
  if (S.room.phase === 'drawn') S.editing = false;
  if (S.editing || (S.formOpen && !S.me && S.room.phase === 'register')) { show('form'); ensureForm(); return; }
  show('main'); renderMain();
  maybeAnimate();
}

/* ---------- หน้าห้อง (หน้าเดียว) ---------- */
function renderMain() {
  var R = S.room, drawn = R.phase === 'drawn', pl = R.players, me = S.me;
  var opened = R.results.filter(function (r) { return r.opened; }).length;
  $('#mCount').textContent = drawn ? opened + ' / ' + pl.length : String(pl.length);
  $('#mCountLab').textContent = drawn ? 'กล่องที่เปิดแล้ว' : 'ของขวัญในห้องแล้ว';
  $('#mSub').textContent = drawn ? 'เปิดกล่องแล้ว จึงเห็นว่าใครได้ของใคร' : (pl.length ? 'ใครลงทะเบียนของขวัญแล้วบ้าง ค้นหาชื่อได้ด้านล่าง' : 'ยังไม่มีใครลงทะเบียนของขวัญ เป็นคนแรกได้เลย');

  var mine = $('#mMine'); mine.replaceChildren();
  var free = $('#mFree'); free.replaceChildren();
  if (!drawn) {
    if (me) {
      var box = el('div', 'prevbox');
      var pv = el('div', 'pv'); pv.innerHTML = G.iconSvg(me.icon, 56);
      var tx = el('div'); tx.append(el('b', null, me.nick + ' · ของขวัญ #' + me.gift_no), el('div', 'hintx', me.unspecified ? 'ไม่ระบุ (กล่องปริศนา)' : me.gift_text));
      var acts = el('div', 'btnrow'); acts.style.marginTop = '8px';
      var e = el('button', 'btn ghost small', 'แก้ไข'); e.type = 'button'; e.addEventListener('click', function () { S.editing = true; route(); });
      acts.append(e); tx.append(acts); box.append(pv, tx); mine.append(box);
    } else {
      var b = el('button', 'btn', 'ลงทะเบียนของขวัญ'); b.type = 'button'; b.style.marginTop = '14px';
      b.addEventListener('click', function () { S.formOpen = true; route(); });
      mine.append(b);
      var fr = pl.filter(function (p) { return p.free; });
      if (fr.length) {
        var fb = el('div', 'freebox');
        fb.append(el('b', null, 'เคยลงทะเบียนแล้วแต่เปลี่ยนเครื่อง?'), el('p', 'hintx', 'ถ้าผู้จัดกด "ปลดเครื่อง" ให้แล้ว เลือกชื่อของคุณเพื่อกลับเข้าห้อง'));
        fr.forEach(function (p) {
          var bt = el('button', 'btn ghost small', p.nick); bt.type = 'button'; bt.style.margin = '4px 6px 0 0';
          bt.addEventListener('click', async function () {
            var r = await api('/api/claim', { id: p.id });
            if (r.status === 200) { toast('ผูกเครื่องนี้กับ ' + p.nick + ' แล้ว'); await refresh(true); }
            else toast(r.error === 'not_free' ? 'ชื่อนี้มีคนผูกเครื่องไปแล้ว' : 'ผูกเครื่องไม่สำเร็จ');
          });
          fb.append(bt);
        });
        free.append(fb);
      }
    }
  } else if (me && S.myRes) {
    var r = S.myRes, tile = el('button', 'btn' + (r.opened_at ? ' ghost' : ''), r.opened_at ? 'ดูของขวัญของฉันอีกครั้ง' : 'แตะเพื่อเปิดกล่องของฉัน');
    tile.type = 'button'; tile.style.margin = '14px 0';
    tile.addEventListener('click', function () { openBox(); });
    mine.append(tile);
  } else if (drawn && !me) {
    mine.append(el('p', 'muted', 'ห้องนี้จับฉลากแล้ว คุณดูได้ว่าใครเปิดกล่องไปแล้วบ้าง'));
  }

  renderFinder();

  var dr = $('#mDraw'); dr.replaceChildren(); dr.hidden = !(me && !drawn);
  if (me && !drawn) {
    var go = el('button', 'btn', 'เริ่มจับฉลาก'); go.type = 'button'; go.disabled = pl.length < 2;
    go.addEventListener('click', startDraw);
    dr.append(go);
    if (pl.length < 2) dr.append(el('span', 'hintx', 'ต้องมีอย่างน้อย 2 คน'));
  }
}
$('#mQ').addEventListener('input', function (e) { S.q = e.target.value; if (S.room) renderFinder(); });

function renderFinder() {
  var R = S.room, drawn = R.phase === 'drawn', q = S.q.trim().toLowerCase();
  var res = $('#mRes'); res.replaceChildren();
  var list = $('#mList'); list.replaceChildren();
  var pl = R.players.filter(function (p) { return !q || p.nick.toLowerCase().indexOf(q) >= 0; });
  if (q && !pl.length) { list.append(el('p', 'muted', 'ไม่พบชื่อนี้')); return; }
  var byTo = {}; R.results.forEach(function (r) { byTo[r.to] = r; });

  if (!drawn) {
    var ul = el('ul', 'who');
    pl.forEach(function (p) {
      var li = el('li'), isMe = S.me && S.me.id === p.id;
      li.append(el('span', 'av', p.nick.slice(0, 1)));
      var nm = el('span', 'nm', p.nick); if (isMe) nm.append(el('span', 'me', 'คุณ'));
      li.append(nm, el('span', 'gn', '#' + p.no));
      if (S.me) {
        var d = el('button', 'mini', 'ลบ'); d.type = 'button'; d.setAttribute('aria-label', 'ลบของขวัญของ ' + p.nick);
        d.addEventListener('click', function () { delGift(p); });
        li.append(d);
      }
      ul.append(li);
    });
    list.append(ul);
    return;
  }

  /* หลังจับฉลาก: ผลค้นหา 2 ทิศทาง + ตารางกล่อง */
  if (q) {
    var hit = R.players.filter(function (p) { return p.nick.toLowerCase() === q; })[0] || (pl.length === 1 ? pl[0] : null);
    if (hit) {
      var mine = byTo[hit.id], sent = R.results.filter(function (r) { return r.from === hit.id; })[0];
      var card = el('div', 'res-card');
      var a = el('div'); a.append(document.createTextNode('🎁 '), el('b', null, hit.nick), document.createTextNode(mine && mine.opened && mine.from ? ' ได้รับของขวัญของ ' : ' ยังไม่เปิดกล่อง จึงยังไม่เห็นว่าได้ของใคร'));
      if (mine && mine.opened && mine.from) a.append(el('b', null, (playerOf(mine.from) || {}).nick || '-'));
      var b2 = el('div'); b2.append(document.createTextNode('📦 ของขวัญของ '), el('b', null, hit.nick));
      b2.append(document.createTextNode(sent ? ' ไปอยู่กับ ' : ' ยังไม่มีใครเปิด จะเห็นเมื่อผู้รับเปิดกล่อง'));
      if (sent) b2.append(el('b', null, (playerOf(sent.to) || {}).nick || '-'));
      card.append(a, b2); res.append(card);
    }
  }
  var grid = el('div', 'gwrap');
  pl.forEach(function (p, i) {
    var r = byTo[p.id], op = !!(r && r.opened), col = COLORS[i % COLORS.length];
    var t = el('button', 'gt' + (op ? ' op' : '') + (S.me && S.me.id === p.id ? ' me' : '') + (S.pin === p.id ? ' pin' : '')); t.type = 'button';
    var tip = el('span', 'tip');
    if (op && r.from) { tip.append(el('b', null, p.nick), document.createTextNode(' ได้รับของขวัญของ '), el('b', null, (playerOf(r.from) || {}).nick || '-')); }
    else tip.textContent = 'ยังไม่เปิดกล่อง · จะเห็นหลังเปิด';
    var gb = el('span', 'gb'); gb.style.display = 'block';
    if (op) gb.append(el('s'));
    var body = el('i'); body.style.background = op ? '#f4c24d' : col;
    var lid = el('u'); lid.style.background = op ? '#ffd978' : col; if (!op) lid.style.filter = 'brightness(1.15)';
    gb.append(body, lid);
    t.append(tip, gb, el('span', 'gl', p.nick)); t.style.display = 'block';
    t.addEventListener('click', function () { S.pin = S.pin === p.id ? '' : p.id; renderFinder(); });
    grid.append(t);
  });
  list.append(grid);
  var lg = el('div', 'legend'); lg.innerHTML = '<span><i style="background:#c8334b"></i>ยังไม่เปิด</span><span><i style="background:#f4c24d"></i>เปิดแล้ว</span>';
  list.append(lg);
}

/* ---------- ลบของขวัญ ถามย้ำ 2 ขั้น ---------- */
async function delGift(p) {
  var self = S.me && S.me.id === p.id;
  var ok = await G.confirmFlow([
    { title: self ? 'ลบของขวัญของคุณ?' : 'ลบของขวัญของ ' + p.nick + '?', ok: 'ดำเนินการต่อ', cancel: 'ไม่ลบแล้ว',
      items: ['ของขวัญ #' + p.no + ' จะถูกลบออกจากห้อง', p.nick + ' จะหายจากรายชื่อ และต้องลงทะเบียนใหม่ถ้าอยากร่วม', 'จำนวนของขวัญจะลดลง 1 ใบ', 'ลบได้เฉพาะก่อนเริ่มจับฉลาก'] },
    { title: 'แน่ใจจริงๆ ใช่ไหม?', ok: 'ยืนยันลบ #' + p.no, cancel: 'ไม่ลบแล้ว', note: 'ลบแล้วกู้คืนไม่ได้ ' + (self ? 'และคุณจะต้องลงทะเบียนใหม่' : 'เจ้าของของขวัญต้องลงทะเบียนใหม่เอง') }
  ]);
  if (!ok) return;
  var r = await api('/api/delete-gift', { id: p.id });
  if (r.status === 200) { toast('ลบแล้ว'); await refresh(true); }
  else toast(r.error === 'closed' ? 'จับฉลากไปแล้ว ลบไม่ได้' : 'ลบไม่สำเร็จ ลองอีกครั้ง');
}

/* ---------- เริ่มจับฉลาก ถามย้ำ 2 ขั้น ---------- */
async function startDraw() {
  var n = S.room.players.length;
  var ok = await G.confirmFlow([
    { title: 'เริ่มจับฉลากตอนนี้?', ok: 'ดำเนินการต่อ', cancel: 'ยังไม่เริ่ม',
      items: ['สุ่มจับคู่ของขวัญ ' + n + ' ใบ ให้ ' + n + ' คน แบบวงเดียว ไม่มีใครได้ของตัวเอง', 'ปิดรับลงทะเบียน และลบของขวัญไม่ได้อีก', 'รถเลื่อนซานต้ารับกล่องจากชั้นวางแล้วบินไปแจก', 'ทุกคนเห็นกล่องของตัวเองบนมือถือ เปิดได้ และเห็นว่าใครได้ของใครหลังเปิดกล่อง'] },
    { title: 'แน่ใจจริงๆ ใช่ไหม?', ok: 'เริ่มจับฉลากเลย', cancel: 'กลับไปตรวจก่อน',
      note: 'ผลสุ่มจะถูกสร้างทันที มีคน ' + n + ' คน และ ' + n + ' ของขวัญ ตรวจให้ครบแล้วหรือยัง? ใครมาช้าจะไม่ได้ร่วมรอบนี้ ถ้าต้องแก้ ผู้จัดห้องต้องกด "รีเซ็ตรอบ"' }
  ]);
  if (!ok) return;
  var r = await api('/api/draw', {});
  if (r.status === 200 || r.error === 'already_drawn') { await refresh(true); }
  else toast(r.error === 'too_few' ? 'ต้องมีอย่างน้อย 2 คน' : 'จับฉลากไม่สำเร็จ ลองอีกครั้ง');
}

/* ---------- ฟอร์มลงทะเบียน ---------- */
var F = { nick: $('#fNick'), gift: $('#fGift'), un: $('#fUn'), submit: $('#fSubmit') };
function setErr(id, m) { $('#' + id).textContent = m || ''; }
function preview() {
  var key = G.guessIcon(F.gift.value, F.un.checked);
  $('#fPrev').innerHTML = G.iconSvg(key, 64);
  $('#fPrevTxt').textContent = F.un.checked ? 'ไม่ระบุ: ผู้รับจะเห็นเป็นกล่องปริศนา ? จนกว่าจะเปิด' : 'ภาพแบนเรียบง่ายที่เลือกให้ตามชื่อของขวัญ';
  F.gift.disabled = F.un.checked;
}
F.gift.addEventListener('input', preview); F.un.addEventListener('change', preview);
var formFor = null;
function ensureForm() {
  var key = S.me ? S.me.id : 'new';
  if (formFor === key) return;
  formFor = key;
  ['eNick', 'eGift', 'eForm'].forEach(function (i) { setErr(i, ''); });
  F.nick.value = S.me ? S.me.nick : ''; F.gift.value = S.me ? S.me.gift_text : ''; F.un.checked = S.me ? S.me.unspecified : false;
  $('#formTitle').textContent = S.me ? 'แก้ข้อมูลของคุณ' : 'ลงทะเบียนของขวัญ';
  F.submit.textContent = S.me ? 'บันทึก' : 'ลงทะเบียน';
  preview();
}
$('#fCancel').addEventListener('click', function () { S.editing = false; S.formOpen = false; formFor = null; route(); });
var ERR = { nick_taken: 'ชื่อนี้มีคนใช้แล้วในห้อง ลองเพิ่มนามสกุลหรือตัวเลข', closed: 'จับฉลากแล้ว ปิดรับลงทะเบียนแล้ว', room_full: 'ห้องนี้เต็มแล้ว (สูงสุด 300 คน)', device_has_other: 'เครื่องนี้ผูกกับรายชื่ออื่นอยู่แล้ว' };
$('#f').addEventListener('submit', async function (e) {
  e.preventDefault();
  ['eNick', 'eGift', 'eForm'].forEach(function (i) { setErr(i, ''); });
  var nick = F.nick.value.trim(), gift = F.gift.value.trim(), un = F.un.checked, ok = true;
  if (!nick) { setErr('eNick', 'ใส่ชื่อก่อน'); ok = false; }
  if (!un && gift.length < 2) { setErr('eGift', 'บอกหน่อยว่าของขวัญคืออะไร หรือเลือก "ไม่ระบุ"'); ok = false; }
  if (!ok) return;
  F.submit.disabled = true;
  var r = await api('/api/join', { nick: nick, gift_text: gift, unspecified: un, icon: G.guessIcon(gift, un) });
  F.submit.disabled = false;
  if (r.status === 200) { S.editing = false; S.formOpen = false; formFor = null; toast('บันทึกแล้ว'); await refresh(true); return; }
  setErr('eForm', ERR[r.error] || 'บันทึกไม่สำเร็จ ลองอีกครั้ง');
});

/* ---------- อนิเมชันรถเลื่อนซานต้า (เล่นครั้งเดียวต่อรอบ) ---------- */
function maybeAnimate() {
  var R = S.room;
  if (R.phase !== 'drawn' || !R.drawn_at || reduced || S.animating) return;
  var k = 'gc-anim-' + CODE;
  try { if (localStorage.getItem(k) === R.drawn_at) return; } catch (e) {}
  if (Date.now() - new Date(R.drawn_at).getTime() > 15 * 60 * 1000) { try { localStorage.setItem(k, R.drawn_at); } catch (e) {} return; }
  S.animating = true;
  var ov = el('div', 'sleighfx'); ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', 'อนิเมชันแจกของขวัญ');
  var scn = el('div', 'scn'), cap = el('div', 'cap'), capT = el('span', null, 'กำลังย้ายกล่องจากชั้นวางเข้ารถเลื่อนซานต้า');
  cap.append(capT);
  var skip = el('button', 'btn ghost small skip', 'ข้าม'); skip.type = 'button';
  ov.append(scn, cap, skip); document.body.append(ov);
  var sc = GCScene.mount(scn, { count: Math.min(R.players.length, 96), fit: 'meet' }), ended = false;
  function end() {
    if (ended) return; ended = true;
    try { localStorage.setItem(k, R.drawn_at); } catch (e) {}
    ov.remove(); S.animating = false; route();
  }
  skip.addEventListener('click', end);
  var caps = { 1: 'กำลังย้ายกล่องจากชั้นวางเข้ารถเลื่อนซานต้า', 2: 'รถเลื่อนบินขึ้นฟ้า', 3: 'แจกของขวัญให้ทุกคนแล้ว' };
  sc.deliver(end, function (n) { capT.textContent = caps[n]; });
}

/* ---------- เปิดกล่องของขวัญ ---------- */
var fxParts = [], fxRun = false;
function openBox() {
  var r = S.myRes; if (!r) return;
  var already = !!r.opened_at;
  var ov = el('div', 'openfx'); ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', 'เปิดกล่องของขวัญ');
  var head = el('p', null, already ? 'ของขวัญของคุณ' : 'แตะกล่องเพื่อเปิด'); head.style.cssText = 'font-size:1.1rem;color:#cdbfe2;margin:18px 0 0;text-align:center';
  var st = el('div', 'stage2');
  var card = el('div', 'ocard');
  var pic = el('div', 'pic'); pic.innerHTML = G.iconSvg(r.icon, 96);
  card.append(pic, el('div', 'no', '#' + r.gift_no), el('p', null, r.unspecified || !r.gift_text ? 'ของขวัญปริศนา (ผู้ให้ไม่ระบุ)' : r.gift_text));
  st.append(el('div', 'glow'), card, el('div', 'obody'), el('div', 'olid'));
  var acts = el('div', 'acts'), close = el('button', 'btn ghost', 'ปิด'); close.type = 'button'; acts.append(close);
  var cv = el('canvas'); cv.setAttribute('aria-hidden', 'true');
  ov.append(head, st, acts, cv); document.body.append(ov); document.body.style.overflow = 'hidden';
  function done() { fxParts = []; ov.remove(); document.body.style.overflow = ''; route(); }
  close.addEventListener('click', done);
  ov.addEventListener('keydown', function (e) { if (e.key === 'Escape') done(); });
  function reveal() {
    ov.classList.add('on'); head.textContent = 'ของขวัญของคุณคือเบอร์ #' + r.gift_no;
    $('#live').textContent = 'ของขวัญของคุณคือเบอร์ ' + r.gift_no;
    confetti(cv);
  }
  if (already) { ov.classList.add('on'); head.textContent = 'ของขวัญของคุณคือเบอร์ #' + r.gift_no; close.focus(); return; }
  var btn = el('button', 'btn', 'เปิดกล่อง'); btn.type = 'button'; acts.prepend(btn);
  function go() {
    if (S.myRes.opened_at) return;
    S.myRes.opened_at = new Date().toISOString();
    btn.remove(); reveal();
    sb.from('results').update({ opened_at: S.myRes.opened_at }).eq('room_id', CODE).eq('receiver_id', S.me.id).then(function (x) {
      if (x && x.error) toast('บันทึกสถานะการเปิดไม่สำเร็จ แต่ผลของคุณยังอยู่');
      else refresh(true);
    });
  }
  btn.addEventListener('click', go); st.addEventListener('click', go); btn.focus();
}
function confetti(cv) {
  if (reduced) return;
  var cx = cv.getContext('2d'), d = Math.min(2, window.devicePixelRatio || 1), W = window.innerWidth, H = window.innerHeight;
  cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
  var cols = ['#f4c24d', '#ffe08a', '#ff6b81', '#46d6b0', '#a78bff', '#f6effc'];
  for (var i = 0; i < 160; i++) {
    var a = -Math.PI / 2 + (Math.random() - .5) * 2.6, v = 13 * (.45 + Math.random() * .75);
    fxParts.push({ x: W / 2, y: H * .45, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6.28, vr: (Math.random() - .5) * .4, w: 5 + Math.random() * 7, h: 3 + Math.random() * 5, c: cols[(Math.random() * cols.length) | 0], life: 1, dec: .006 + Math.random() * .008 });
  }
  if (fxRun) return; fxRun = true;
  (function loop() {
    cx.clearRect(0, 0, W, H);
    fxParts = fxParts.filter(function (p) { return p.life > 0 && p.y < H + 40; });
    fxParts.forEach(function (p) {
      p.vy += .28; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= p.dec;
      cx.save(); cx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6)); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
    });
    if (fxParts.length && cv.isConnected) requestAnimationFrame(loop); else { fxRun = false; cx.clearRect(0, 0, W, H); }
  })();
}

show('boot');
boot();
})();
